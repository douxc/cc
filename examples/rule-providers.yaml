# Merge these declarations into your existing rule-providers section.
# Keep existing provider names and RULE-SET order when updating a deployed config.
rule-providers:
  my_default_direct:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/douxc/cc/main/direct.txt
    path: ./rules/cc/direct.txt
    interval: 86400
  my_default_proxy:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/douxc/cc/main/default_proxy.txt
    path: ./rules/cc/default_proxy.txt
    interval: 86400
  my_default_reject:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/douxc/cc/main/default_reject.txt
    path: ./rules/cc/default_reject.txt
    interval: 86400
  direct_ip:
    type: http
    behavior: ipcidr
    format: text
    url: https://raw.githubusercontent.com/douxc/cc/main/direct_ip.txt
    path: ./rules/cc/direct_ip.txt
    interval: 86400
  github_cidr:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/douxc/cc/main/github_cidr.txt
    path: ./rules/cc/github_cidr.txt
    interval: 86400
  ip_proxy:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/douxc/cc/main/ip-proxy.txt
    path: ./rules/cc/ip-proxy.txt
    interval: 86400
